name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Reglas, lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Sin client.config.json real en CI: se usa el ejemplo del repo.
      CLUMERA_CLIENT_CONFIG: client.config.example.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reglas de dependencia
        run: npm run check:deps
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm run test
      - name: Build
        run: npm run build
